name: Audit model completeness

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/v4/**'
      - 'data/v6/**'
      - 'data/enrichment/**'
      - 'scripts/apply_v6_overlay.py'
      - 'scripts/apply_verified_enrichment.py'
      - 'scripts/audit_model_completeness.py'
      - 'scripts/validate_gallery_urls.py'
      - '.github/workflows/audit-model-completeness.yml'
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write

concurrency:
  group: drivespeclab-repo-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified V6 enrichment layer
        run: python scripts/apply_v6_overlay.py

      - name: Apply verified priority enrichment
        run: python scripts/apply_verified_enrichment.py

      - name: Generate completeness report
        run: python scripts/audit_model_completeness.py

      - name: Check gallery URL health
        run: python scripts/validate_gallery_urls.py

      - name: Validate reports
        run: |
          python - <<'PY'
          import json

          completeness = json.load(open('data/audit/model-completeness.json', encoding='utf-8'))
          assert 'summary' in completeness
          assert completeness['summary']['current_models_audited'] >= 0
          print('Completeness:')
          print(json.dumps(completeness['summary'], indent=2))

          gallery = json.load(open('data/audit/gallery-health.json', encoding='utf-8'))
          assert 'summary' in gallery
          assert gallery['summary']['gallery_urls_checked'] >= 0
          assert gallery['summary']['healthy_gallery_urls'] + gallery['summary']['unhealthy_gallery_urls'] == gallery['summary']['gallery_urls_checked']
          print('Gallery health:')
          print(json.dumps(gallery['summary'], indent=2))
          PY

      - name: Commit reports if changed
        run: |
          git config user.name 'drivespeclab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            data/audit/model-completeness.json \
            data/audit/MODEL_COMPLETENESS.md \
            data/audit/gallery-health.json \
            data/audit/GALLERY_HEALTH.md
          # Enrichment overlays are applied only inside this CI workspace.
          git restore --worktree data/v4
          if git diff --cached --quiet; then
            echo 'No audit changes.'
            exit 0
          fi
          git commit -m 'Update data quality audits'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another repository writer; retrying (${attempt}/3)..."
            sleep 2
          done
          exit 1
