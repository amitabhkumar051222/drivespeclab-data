name: Audit model completeness

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/v4/**'
      - 'data/v6/**'
      - 'scripts/apply_v6_overlay.py'
      - 'scripts/audit_model_completeness.py'
      - '.github/workflows/audit-model-completeness.yml'
  schedule:
    - cron: '37 3 * * *'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply verified V6 enrichment layer
        run: python scripts/apply_v6_overlay.py

      - name: Generate completeness report
        run: python scripts/audit_model_completeness.py

      - name: Validate report
        run: |
          python - <<'PY'
          import json
          p='data/audit/model-completeness.json'
          d=json.load(open(p, encoding='utf-8'))
          assert 'summary' in d
          assert d['summary']['current_models_audited'] >= 0
          print(json.dumps(d['summary'], indent=2))
          PY

      - name: Commit report if changed
        run: |
          if git diff --quiet -- data/audit/model-completeness.json data/audit/MODEL_COMPLETENESS.md; then
            echo 'No audit changes.'
            exit 0
          fi
          git config user.name 'drivespeclab-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/audit/model-completeness.json data/audit/MODEL_COMPLETENESS.md
          git commit -m 'Update model completeness audit'
          git pull --rebase origin main
          git push
