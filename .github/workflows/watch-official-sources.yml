name: Watch official vehicle sources

on:
  workflow_dispatch:
  schedule:
    - cron: '41 4 * * *'

permissions:
  contents: write

concurrency:
  group: drivespeclab-repo-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test source failure and pending-review preservation
        run: python -m unittest discover -s tests -v
      - name: Check official manufacturer pages for material changes
        run: python scripts/watch_official_sources.py
      - name: Commit monitoring state when changed
        run: |
          git config user.name 'DriveSpecLab Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/monitor/official-source-fingerprints.json data/monitor/pending-source-changes.json
          if git diff --cached --quiet; then
            echo 'No source-monitor changes.'
          else
            git commit -m 'Update official source monitor'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
