name: Build database-first vehicle catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * *'
  push:
    branches: [ main ]
    paths:
      - 'data/db/**'
      - 'data/v4/**'
      - 'scripts/generate_database_catalog.py'
      - '.github/workflows/build-database-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build database catalog, upcoming index and compare index
        run: python scripts/generate_database_catalog.py
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
            Path('data/catalog/cars.json'),
            Path('data/catalog/upcoming.json'),
            Path('data/catalog/change-log.json'),
            Path('data/compare/cars.json'),
          ]
          for p in files:
              json.loads(p.read_text(encoding='utf-8'))
          print('Validated', len(files), 'JSON files')
          PY
      - name: Commit generated database indexes
        run: |
          git config user.name 'DriveSpecLab Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/catalog data/compare/cars.json
          if git diff --cached --quiet; then
            echo 'No database-index changes.'
          else
            git commit -m 'Build database-first vehicle catalog'
            git push
          fi
