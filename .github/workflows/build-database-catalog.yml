name: Build database-first vehicle catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * *'
  push:
    branches: [ main ]
    paths:
      - 'data/db/**'
      - 'data/v4/**'
      - 'data/v6/**'
      - 'data/catalog/brand-registry-live.json'
      - 'data/catalog/global-cars-live.json'
      - 'data/seo/model-routes-live.json'
      - 'scripts/apply_v6_overlay.py'
      - 'scripts/generate_database_catalog.py'
      - 'scripts/postprocess_catalog.py'
      - 'scripts/sync_catalog_manifest.py'
      - '.github/workflows/build-database-catalog.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply verified V6 enrichment layer
        run: python scripts/apply_v6_overlay.py
      - name: Build database catalog, upcoming index and compare index
        run: python scripts/generate_database_catalog.py
      - name: Apply conservative catalog policy
        run: python scripts/postprocess_catalog.py
      - name: Sync 25-brand live manifest
        run: python scripts/sync_catalog_manifest.py
      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = [
            Path('data/catalog/cars.json'),
            Path('data/catalog/upcoming.json'),
            Path('data/catalog/change-log.json'),
            Path('data/catalog/brand-registry-live.json'),
            Path('data/catalog/global-cars-live.json'),
            Path('data/catalog/catalog-manifest-live.json'),
            Path('data/compare/cars.json'),
            Path('data/seo/model-routes-live.json'),
          ]
          for p in files:
              json.loads(p.read_text(encoding='utf-8'))
          print('Validated', len(files), 'JSON files')
          PY
      - name: Commit generated database indexes
        run: |
          git config user.name 'DriveSpecLab Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/catalog data/compare/cars.json data/seo/model-routes-live.json
          if git diff --cached --quiet; then
            echo 'No database-index changes.'
          else
            git commit -m 'Build database-first 25-brand vehicle catalog'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
