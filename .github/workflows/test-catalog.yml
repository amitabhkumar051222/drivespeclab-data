name: Test catalog and website adapter
on:
  push:
    branches: [main]
    paths: ['js/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/test-catalog.yml']
  pull_request:
    paths: ['js/**', 'scripts/**', 'tests/**', 'package*.json', '.github/workflows/test-catalog.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python -m unittest discover -s tests -v
      - run: python scripts/update_car_database.py --check
