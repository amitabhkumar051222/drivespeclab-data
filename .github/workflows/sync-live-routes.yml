name: Sync live model routes and compare index

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [ main ]
    paths:
      - 'dist/model-pages-manifest.csv'
      - 'data/db/**'
      - 'data/v4/**'
      - 'scripts/sync_live_model_routes.py'
      - 'scripts/generate_compare_index.py'
      - '.github/workflows/sync-live-routes.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync confirmed live Blogger model URLs
        run: python scripts/sync_live_model_routes.py
      - name: Build comparison index
        run: python scripts/generate_compare_index.py
      - name: Commit route/index changes
        run: |
          git config user.name 'DriveSpecLab Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/seo/model-routes-live.json data/compare/cars.json
          if git diff --cached --quiet; then
            echo 'No live-route/index changes.'
          else
            git commit -m 'Sync live model routes and compare index'
            git push
          fi
