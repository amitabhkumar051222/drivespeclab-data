name: Validate pricing data
on:
  push:
    paths:
      - 'pricing/**'
      - '.github/workflows/pricing-validation.yml'
  pull_request:
    paths:
      - 'pricing/**'
      - '.github/workflows/pricing-validation.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate pricing records
        run: python pricing/validate.py
