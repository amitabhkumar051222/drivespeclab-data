name: Build database-first vehicle catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '11 3 * * *'
  push:
    branches: [ main ]
    paths:
      - 'data/db/**'
      - 'data/v4/**'
      - 'data/v6/**'
      - 'data/enrichment/**'
      - 'data/catalog/brand-registry-live.json'
      - 'data/catalog/global-cars-live.json'
      - 'data/seo/model-routes-live.json'
      - 'scripts/apply_v6_overlay.py'
      - 'scripts/apply_verified_enrichment.py'
      - 'scripts/generate_database_catalog.py'
      - 'scripts/postprocess_catalog.py'
      - 'scripts/sync_catalog_manifest.py'
      - 'scripts/update_car_database.py'
      - 'scripts/validate_catalog.py'
      - 'tests/**'
      - '.github/workflows/build-database-catalog.yml'

permissions:
  contents: write

concurrency:
  group: drivespeclab-repo-writer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and validate catalog in isolated workspace
        run: python scripts/update_car_database.py
      - name: Commit generated database indexes
        run: |
          git config user.name 'DriveSpecLab Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/catalog data/compare/cars.json data/seo/model-routes-live.json
          # V6 and priority enrichment are applied to V4 only inside this CI
          # workspace. Restore temporary overlays before rebase/push.
          git restore --worktree data/v4
          if git diff --cached --quiet; then
            echo 'No database-index changes.'
            exit 0
          fi
          git commit -m 'Build database-first 25-brand vehicle catalog'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another repository writer; retrying (${attempt}/3)..."
            sleep 2
          done
          exit 1
